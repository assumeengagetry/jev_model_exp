<text x="76.00" y="715.00" fill="#172d43" font-size="18" text-anchor="start" font-weight="400">TIES、权重平均：各部署一个 0.6B 模型；概率集成：同一问题需要五个专家输出，不是单模型权重融合。</text>
<text x="76.00" y="743.00" fill="#566d80" font-size="16" text-anchor="start" font-weight="400">本图仅为当前单 seed、短预算实验的观察结果，不把弱专家与融合干扰解释成同一个原因。</text>
</svg>