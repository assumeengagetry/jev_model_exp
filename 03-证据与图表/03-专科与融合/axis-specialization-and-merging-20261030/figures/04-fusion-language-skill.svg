<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="800" viewBox="0 0 1540 800" role="img" aria-labelledby="title desc">
<title id="title">固定融合没有超过混合训练：TIES 最接近，但仍损失约 22%</title><desc id="desc">比较的是相同训练数据曝光总量：混合模型约 15M tokens，等于五个专家各约 3M 的总和。</desc>
<style>text{font-family:"Noto Sans CJK SC","Source Han Sans CN",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0.00" y="0.00" width="1540.00" height="800.00" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="54.00" y="57.00" fill="#172d43" font-size="29" text-anchor="start" font-weight="700">固定融合没有超过混合训练：TIES 最接近，但仍损失约 22%</text>
<text x="54.00" y="93.00" fill="#566d80" font-size="17" text-anchor="start" font-weight="400">比较的是相同训练数据曝光总量：混合模型约 15M tokens，等于五个专家各约 3M 的总和。</text>
