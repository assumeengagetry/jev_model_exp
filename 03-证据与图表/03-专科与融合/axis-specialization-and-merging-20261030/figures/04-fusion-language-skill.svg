<text x="270.00" y="457.00" fill="#172d43" font-size="23" text-anchor="end" font-weight="400">概率集成</text>
<rect x="300.00" y="426.00" width="365.96" height="47.00" rx="4" fill="#20856f" stroke="none" stroke-width="1"/>
