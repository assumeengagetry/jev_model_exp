<text x="655.00" y="640.00" fill="#566d80" font-size="17" text-anchor="middle" font-weight="400">20</text>
<line x1="832.50" y1="190.00" x2="832.50" y2="610.00" stroke="#d9e4ec" stroke-width="1"/>
