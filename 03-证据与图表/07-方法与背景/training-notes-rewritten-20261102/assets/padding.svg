<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="长度100、200和1000的三条文本，补齐后每行占1000个位置"><title>长度100、200和1000的三条文本，补齐后每行占1000个位置</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#627278" stroke-width="1.4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5eaeb"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#c9d3d5" stroke-width="1"/></pattern></defs><rect width="900" height="420" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="24" y="38" fill="#263b41" font-size="26" text-anchor="start" font-weight="600">一条长文本，把整批的行宽都拉长了</text><text x="24" y="73" fill="#627278" font-size="20" text-anchor="start" font-weight="400">示例：100、200、1000 个 tokens；斜纹部分是补出来的空位</text><text x="24" y="139" fill="#263b41" font-size="20" text-anchor="start" font-weight="400">A · 100</text><rect x="160" y="110" width="700" height="44" rx="0" fill="url(#hatch)" stroke="none"/><rect x="160" y="110" width="70" height="44" rx="0" fill="#267567" stroke="none"/><text x="24" y="212" fill="#263b41" font-size="20" text-anchor="start" font-weight="400">B · 200</text><rect x="160" y="183" width="700" height="44" rx="0" fill="url(#hatch)" stroke="none"/><rect x="160" y="183" width="140" height="44" rx="0" fill="#386b95" stroke="none"/><text x="24" y="285" fill="#263b41" font-size="20" text-anchor="start" font-weight="400">C · 1000</text><rect x="160" y="256" width="700" height="44" rx="0" fill="url(#hatch)" stroke="none"/><rect x="160" y="256" width="700" height="44" rx="0" fill="#9d681d" stroke="none"/><text x="160" y="359" fill="#263b41" font-size="22" text-anchor="start" font-weight="400">三条真实文本共 1300 个 tokens，补齐后占 3000 个位置。</text><text x="160" y="393" fill="#627278" font-size="20" text-anchor="start" font-weight="400">分桶让长度相近的文本一起排队，减少这些空位。</text></g></svg>