<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="380" viewBox="0 0 1024 380" role="img" aria-label="学习安排经过 GPU 执行，由评测结果反馈下一轮训练"><title>学习安排经过 GPU 执行，由评测结果反馈下一轮训练</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#627278" stroke-width="1.4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5eaeb"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#c9d3d5" stroke-width="1"/></pattern></defs><rect width="1024" height="380" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="24" y="38" fill="#263b41" font-size="26" text-anchor="start" font-weight="600">这些知识，在训练体系的什么位置？</text><text x="24" y="72" fill="#627278" font-size="19" text-anchor="start" font-weight="400">围绕一次已有模型的训练，展开三个相连的部分</text><rect x="24" y="105" width="296" height="210" rx="9" fill="#eaf5ee" stroke="none"/><text x="44" y="143" fill="#267567" font-size="27" text-anchor="start" font-weight="600">怎样学</text><text x="44" y="174" fill="#267567" font-size="18" text-anchor="start" font-weight="400">第一篇 · 学习安排</text><text x="44" y="219" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">前向 → 损失 → 反向 → 更新</text><text x="44" y="251" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">batch：一次参考多少条</text><text x="44" y="283" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">学习率：每次调整多大</text><rect x="364" y="105" width="296" height="210" rx="9" fill="#eaf1fa" stroke="none"/><text x="384" y="143" fill="#386b95" font-size="27" text-anchor="start" font-weight="600">怎样执行</text><text x="384" y="174" fill="#386b95" font-size="18" text-anchor="start" font-weight="400">两篇相接 · GPU 效率</text><text x="384" y="219" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">microbatch / 累积 / 检查点</text><text x="384" y="251" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">分桶 → 填充 → packing</text><text x="384" y="283" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">Flash / varlen / 动态微批</text><rect x="704" y="105" width="296" height="210" rx="9" fill="#faf1df" stroke="none"/><text x="724" y="143" fill="#9d681d" font-size="27" text-anchor="start" font-weight="600">学得怎样</text><text x="724" y="174" fill="#9d681d" font-size="18" text-anchor="start" font-weight="400">第一篇 · 评测反馈</text><text x="724" y="219" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">Native：想提升的整体能力</text><text x="724" y="251" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">D0：原有任务保持情况</text><text x="724" y="283" fill="#263b41" font-size="19" text-anchor="start" font-weight="400">accuracy + loss：一起看</text><path d="M 325 205 L 353 205" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><path d="M 665 205 L 693 205" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><path d="M 852 327 V 352 H 172 V 328" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="335" width="306" height="34" rx="0" fill="#ffffff" stroke="none"/><text x="513" y="358" fill="#627278" font-size="18" text-anchor="middle" font-weight="400">结果再反馈给下一轮学习安排</text></g></svg>