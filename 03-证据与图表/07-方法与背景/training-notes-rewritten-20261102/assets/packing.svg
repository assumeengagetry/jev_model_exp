<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-label="三条样本从12个位置紧凑为9个，边界为0、3、5、9，各产生一个分类结果"><title>三条样本从12个位置紧凑为9个，边界为0、3、5、9，各产生一个分类结果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#627278" stroke-width="1.4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5eaeb"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#c9d3d5" stroke-width="1"/></pattern></defs><rect width="960" height="550" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="24" y="38" fill="#263b41" font-size="26" text-anchor="start" font-weight="600">紧凑地存放，仍然是三道独立的题</text><text x="24" y="74" fill="#627278" font-size="20" text-anchor="start" font-weight="400">示例：A 有 3 个词元，B 有 2 个，C 有 4 个</text><text x="24" y="134" fill="#267567" font-size="23" text-anchor="start" font-weight="600">A</text><rect x="125" y="106" width="84" height="36" rx="3" fill="#eaf5ee" stroke="none"/><text x="167" y="131" fill="#267567" font-size="19" text-anchor="middle" font-weight="400">A1</text><rect x="213" y="106" width="84" height="36" rx="3" fill="#eaf5ee" stroke="none"/><text x="255" y="131" fill="#267567" font-size="19" text-anchor="middle" font-weight="400">A2</text><rect x="301" y="106" width="84" height="36" rx="3" fill="#eaf5ee" stroke="none"/><text x="343" y="131" fill="#267567" font-size="19" text-anchor="middle" font-weight="400">A3</text><rect x="389" y="106" width="84" height="36" rx="3" fill="url(#hatch)" stroke="none"/><text x="24" y="186" fill="#386b95" font-size="23" text-anchor="start" font-weight="600">B</text><rect x="125" y="158" width="84" height="36" rx="3" fill="#eaf1fa" stroke="none"/><text x="167" y="183" fill="#386b95" font-size="19" text-anchor="middle" font-weight="400">B1</text><rect x="213" y="158" width="84" height="36" rx="3" fill="#eaf1fa" stroke="none"/><text x="255" y="183" fill="#386b95" font-size="19" text-anchor="middle" font-weight="400">B2</text><rect x="301" y="158" width="84" height="36" rx="3" fill="url(#hatch)" stroke="none"/><rect x="389" y="158" width="84" height="36" rx="3" fill="url(#hatch)" stroke="none"/><text x="24" y="238" fill="#9d681d" font-size="23" text-anchor="start" font-weight="600">C</text><rect x="125" y="210" width="84" height="36" rx="3" fill="#faf1df" stroke="none"/><text x="167" y="235" fill="#9d681d" font-size="19" text-anchor="middle" font-weight="400">C1</text><rect x="213" y="210" width="84" height="36" rx="3" fill="#faf1df" stroke="none"/><text x="255" y="235" fill="#9d681d" font-size="19" text-anchor="middle" font-weight="400">C2</text><rect x="301" y="210" width="84" height="36" rx="3" fill="#faf1df" stroke="none"/><text x="343" y="235" fill="#9d681d" font-size="19" text-anchor="middle" font-weight="400">C3</text><rect x="389" y="210" width="84" height="36" rx="3" fill="#faf1df" stroke="none"/><text x="431" y="235" fill="#9d681d" font-size="19" text-anchor="middle" font-weight="400">C4</text><text x="540" y="166" fill="#263b41" font-size="22" text-anchor="start" font-weight="400">补齐后的存放</text><text x="540" y="201" fill="#627278" font-size="20" text-anchor="start" font-weight="400">12 个位置，其中 9 个有内容</text><path d="M 478 272 L 478 302" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="326" width="94" height="43" rx="3" fill="#eaf5ee" stroke="none"/><text x="83" y="355" fill="#267567" font-size="20" text-anchor="middle" font-weight="400">A1</text><rect x="134" y="326" width="94" height="43" rx="3" fill="#eaf5ee" stroke="none"/><text x="181" y="355" fill="#267567" font-size="20" text-anchor="middle" font-weight="400">A2</text><rect x="232" y="326" width="94" height="43" rx="3" fill="#eaf5ee" stroke="none"/><text x="279" y="355" fill="#267567" font-size="20" text-anchor="middle" font-weight="400">A3</text><rect x="330" y="326" width="94" height="43" rx="3" fill="#eaf1fa" stroke="none"/><text x="377" y="355" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">B1</text><rect x="428" y="326" width="94" height="43" rx="3" fill="#eaf1fa" stroke="none"/><text x="475" y="355" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">B2</text><rect x="526" y="326" width="94" height="43" rx="3" fill="#faf1df" stroke="none"/><text x="573" y="355" fill="#9d681d" font-size="20" text-anchor="middle" font-weight="400">C1</text><rect x="624" y="326" width="94" height="43" rx="3" fill="#faf1df" stroke="none"/><text x="671" y="355" fill="#9d681d" font-size="20" text-anchor="middle" font-weight="400">C2</text><rect x="722" y="326" width="94" height="43" rx="3" fill="#faf1df" stroke="none"/><text x="769" y="355" fill="#9d681d" font-size="20" text-anchor="middle" font-weight="400">C3</text><rect x="820" y="326" width="94" height="43" rx="3" fill="#faf1df" stroke="none"/><text x="867" y="355" fill="#9d681d" font-size="20" text-anchor="middle" font-weight="400">C4</text><path d="M 34 316 L 34 381" fill="none" stroke="#627278" stroke-width="2"/><text x="34" y="406" fill="#627278" font-size="19" text-anchor="middle" font-weight="400">0</text><path d="M 328 316 L 328 381" fill="none" stroke="#627278" stroke-width="2"/><text x="328" y="406" fill="#627278" font-size="19" text-anchor="middle" font-weight="400">3</text><path d="M 524 316 L 524 381" fill="none" stroke="#627278" stroke-width="2"/><text x="524" y="406" fill="#627278" font-size="19" text-anchor="middle" font-weight="400">5</text><path d="M 916 316 L 916 381" fill="none" stroke="#627278" stroke-width="2"/><text x="916" y="406" fill="#627278" font-size="19" text-anchor="middle" font-weight="400">9</text><path d="M 181 422 L 181 447" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><text x="181" y="478" fill="#267567" font-size="21" text-anchor="middle" font-weight="600">A 的分类结果</text><path d="M 426 422 L 426 447" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><text x="426" y="478" fill="#386b95" font-size="21" text-anchor="middle" font-weight="600">B 的分类结果</text><path d="M 720 422 L 720 447" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="478" fill="#9d681d" font-size="21" text-anchor="middle" font-weight="600">C 的分类结果</text><text x="478" y="528" fill="#263b41" font-size="21" text-anchor="middle" font-weight="400">packing 管紧凑存放；varlen 按边界让 A、B、C 各算各的。</text></g></svg>