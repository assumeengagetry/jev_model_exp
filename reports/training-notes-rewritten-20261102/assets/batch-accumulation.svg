<svg xmlns="http://www.w3.org/2000/svg" width="880" height="475" viewBox="0 0 880 475" role="img" aria-label="四个32条微批累积梯度，最后只更新一次参数"><title>四个32条微批累积梯度，最后只更新一次参数</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#627278" stroke-width="1.4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e5eaeb"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#c9d3d5" stroke-width="1"/></pattern></defs><rect width="880" height="475" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="24" y="38" fill="#263b41" font-size="26" text-anchor="start" font-weight="600">同一次更新：128 条样本，分四趟处理</text><text x="24" y="72" fill="#627278" font-size="20" text-anchor="start" font-weight="400">四趟都使用同一组参数；每趟做完前向和反向，先留下梯度</text><rect x="24" y="110" width="190" height="100" rx="9" fill="#eaf1fa" stroke="none"/><text x="119" y="145" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">第 1 趟</text><text x="119" y="181" fill="#263b41" font-size="25" text-anchor="middle" font-weight="600">32 条样本</text><path d="M 119 218 L 119 246" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="238" y="110" width="190" height="100" rx="9" fill="#eaf1fa" stroke="none"/><text x="333" y="145" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">第 2 趟</text><text x="333" y="181" fill="#263b41" font-size="25" text-anchor="middle" font-weight="600">32 条样本</text><path d="M 333 218 L 333 246" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="452" y="110" width="190" height="100" rx="9" fill="#eaf1fa" stroke="none"/><text x="547" y="145" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">第 3 趟</text><text x="547" y="181" fill="#263b41" font-size="25" text-anchor="middle" font-weight="600">32 条样本</text><path d="M 547 218 L 547 246" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="666" y="110" width="190" height="100" rx="9" fill="#eaf1fa" stroke="none"/><text x="761" y="145" fill="#386b95" font-size="20" text-anchor="middle" font-weight="400">第 4 趟</text><text x="761" y="181" fill="#263b41" font-size="25" text-anchor="middle" font-weight="600">32 条样本</text><path d="M 761 218 L 761 246" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="256" width="832" height="58" rx="9" fill="#eaf5ee" stroke="none"/><text x="440" y="293" fill="#267567" font-size="23" text-anchor="middle" font-weight="400">梯度累积：汇总这 128 条样本提供的调整信息</text><path d="M 440 323 L 440 348" fill="none" stroke="#627278" stroke-width="2" marker-end="url(#arrow)"/><rect x="291" y="359" width="298" height="56" rx="9" fill="#faf1df" stroke="none"/><text x="440" y="395" fill="#9d681d" font-size="25" text-anchor="middle" font-weight="600">参数统一更新一次</text><text x="440" y="452" fill="#627278" font-size="20" text-anchor="middle" font-weight="400">microbatch 管每趟装多少；有效 batch 管一次更新参考多少。</text></g></svg>