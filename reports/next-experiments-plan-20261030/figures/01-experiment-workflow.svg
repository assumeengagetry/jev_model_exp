<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1010" viewBox="0 0 1640 1010" role="img" aria-labelledby="title desc">
<title id="title">融合结束后，只新增 HARD／SOFT／HYBRID 三组蒸馏续训</title><desc id="desc">实验设计图：复用已完成阶段的 Student 和数据；不重训专科，不再次模型融合。</desc>
<style>text{font-family:"Noto Sans CJK SC","Source Han Sans CN",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0.00" y="0.00" width="1640.00" height="1010.00" fill="#ffffff" stroke="none" rx="0"/>
<text x="54.00" y="58.00" fill="#172d43" font-size="29" text-anchor="start" font-weight="700">融合结束后，只新增 HARD／SOFT／HYBRID 三组蒸馏续训</text>
<text x="54.00" y="96.00" fill="#566d80" font-size="17" text-anchor="start" font-weight="400">实验设计图：复用已完成阶段的 Student 和数据；不重训专科，不再次模型融合。</text>
<rect x="54.00" y="151.00" width="730.00" height="142.00" fill="#edf4f9" stroke="none" rx="12"/>
