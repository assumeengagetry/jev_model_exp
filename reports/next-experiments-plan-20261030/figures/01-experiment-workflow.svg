<text x="80.00" y="232.00" fill="#172d43" font-size="21" text-anchor="start" font-weight="400">融合实验结束后，固定一个 0.6B checkpoint。</text>
<text x="80.00" y="270.00" fill="#566d80" font-size="18" text-anchor="start" font-weight="400">三组继承完全相同的权重、分类头与适配结构。</text>
<rect x="850.00" y="151.00" width="736.00" height="142.00" fill="#fcf2e7" stroke="none" rx="12"/>
